server:
  port: 5140

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    # {vendor} resolves to "postgresql" in production and "h2" in tests, so
    # Postgres-only migrations stay out of the H2 test database
    locations: classpath:db/migration,classpath:db/migration/{vendor}
app:
  issuer: ${ISSUER}
  keystore:
    location: ${KEYSTORE_LOCATION}
    password: ${KEYSTORE_PASSWORD}
    key-alias: ${KEY_ALIAS:test}
    key-password: ${KEY_PASSWORD}

